apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-route
  namespace: parcial-vyll
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`vyncen-home.local`)
      kind: Rule
      services:
        - name: home
          port: 80

