apiVersion: v1
kind: ConfigMap
metadata:
  name: about-html
  namespace: parcial-vyll
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>About Vyncen</title>
      <style>
        body {
          margin: 0;
          font-family: Arial, sans-serif;
          background: #708993;
          color: #19183b;
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
        }
        .card {
          background: #f4e9c2;
          padding: 45px;
          border-radius: 20px;
          text-align: center;
          width: 500px;
          box-shadow: 0 10px 30px rgba(0,0,0,.25);
        }
        h1 { margin-bottom: 10px; }
        .tag {
          display: inline-block;
          background: #b2d0cc;
          padding: 10px 18px;
          border-radius: 20px;
          margin-top: 15px;
        }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>Acerca de Vyncen</h1>
        <p>Estudiante de Ingenieria en Sistemas.</p>
        <div class="tag">Aplicacion 2</div>
      </div>
    </body>
    </html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: about
  namespace: parcial-vyll
spec:
  replicas: 1
  selector:
    matchLabels:
      app: about
  template:
    metadata:
      labels:
        app: about
    spec:
      containers:
        - name: httpd
          image: httpd:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/local/apache2/htdocs
      volumes:
        - name: html
          configMap:
            name: about-html

---
apiVersion: v1
kind: Service
metadata:
  name: about
  namespace: parcial-vyll
spec:
  selector:
    app: about
  ports:
    - port: 80
      targetPort: 80
