
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home
  namespace: parcial-vyll
spec:
  replicas: 2
  selector:
    matchLabels:
      app: home
  template:
    metadata:
      labels:
        app: home
    spec:
      containers:
        - name: httpd
          image: httpd:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/local/apache2/htdocs
      volumes:
        - name: html
          configMap:
            name: home-html
---
apiVersion: v1
kind: Service
metadata:
  name: home
  namespace: parcial-vyll
spec:
  selector:
    app: home
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: about
  namespace: parcial-vyll
spec:
  replicas: 1
  selector:
    matchLabels:
      app: about
  template:
    metadata:
      labels:
        app: about
    spec:
      containers:
        - name: httpd
          image: httpd:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/local/apache2/htdocs
      volumes:
        - name: html
          configMap:
            name: about-html
---
apiVersion: v1
kind: Service
metadata:
  name: about
  namespace: parcial-vyll
spec:
  selector:
    app: about
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
