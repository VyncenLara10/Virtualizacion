apiVersion: v1
kind: ConfigMap
metadata:
  name: home-html
  namespace: parcial-vyll
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Vyncen Home</title>
      <style>
        body {
          margin: 0;
          font-family: Arial, sans-serif;
          background: #19183b;
          color: white;
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
        }
        .card {
          background: #ffffff;
          color: #19183b;
          padding: 45px;
          border-radius: 20px;
          text-align: center;
          width: 500px;
          box-shadow: 0 10px 30px rgba(0,0,0,.3);
        }
        h1 { margin-bottom: 10px; }
        p { color: #555; }
        .tag {
          display: inline-block;
          background: #b2d0cc;
          padding: 10px 18px;
          border-radius: 20px;
          margin-top: 15px;
        }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>Parcial Vyncen Lara</h1>
        <p>Kubernetes + Traefik + MetalLB</p>
        <div class="tag">Aplicacion 1</div>
      </div>
    </body>
    </html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home
  namespace: parcial-vyll
spec:
  replicas: 1
  selector:
    matchLabels:
      app: home
  template:
    metadata:
      labels:
        app: home
    spec:
      containers:
        - name: httpd
          image: httpd:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/local/apache2/htdocs
      volumes:
        - name: html
          configMap:
            name: home-html

---
apiVersion: v1
kind: Service
metadata:
  name: home
  namespace: parcial-vyll
spec:
  selector:
    app: home
  ports:
    - port: 80
      targetPort: 80