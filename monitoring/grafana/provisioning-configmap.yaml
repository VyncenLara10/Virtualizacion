
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring-vyll
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://monitoring-kube-prometheus-prometheus.monitoring-vyll.svc.cluster.local:9090
        isDefault: true
        editable: false
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.monitoring-vyll.svc.cluster.local:3100
        editable: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Kubernetes Monitoring
        orgId: 1
        folder: Kubernetes
        type: file
        disableDeletion: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
