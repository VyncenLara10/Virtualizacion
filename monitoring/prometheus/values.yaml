
grafana:
  enabled: true
  adminUser: admin
  adminPassword: "ChangeMe-Admin-2026"

  service:
    type: ClusterIP

  persistence:
    enabled: false

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring-vyll
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: false

  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring-vyll.svc.cluster.local:3100
      isDefault: false
      editable: false

prometheus:
  enabled: true

  service:
    type: ClusterIP

  prometheusSpec:
    retention: 3d
    scrapeInterval: 30s
    evaluationInterval: 30s

    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

alertmanager:
  enabled: false

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
